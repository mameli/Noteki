[package]
name = "noteki"
version = "0.4.5"
edition = "2021"
description = "Light native editor for an Obsidian Markdown vault"
license = "MIT"

[package.metadata.noteki]
# CFBundleVersion: Sparkle compares it, one more at every release (the Swift
# app's last was 3). scripts/release.sh checks.
build = 9

[lib]
name = "noteki"
path = "src/lib.rs"

[[bin]]
name = "noteki"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "0.10.0", features = ["syntect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
similar = "2"
# Find in a Note (already built in through syntect).
regex = "1"
unicode-segmentation = "1"
# Code blocks' colours: the same syntect and syntax set GPUI Kit's `syntect`
# feature already builds in, so they add nothing to the binary.
syntect = { version = "5.3", default-features = false }
two-face = { version = "0.4.5", default-features = false }
imagesize = "0.13"
dirs = "6"
chrono = "0.4"
# Export as HTML (see core::export).
markdown = "=1.0.0"
# Search without lowering every Note at each key (already built in by regex).
memchr = "2"
# Files the Finder asks to open, handed to the window (already built in by GPUI).
async-channel = "2"
# Formulas typeset as KaTeX does, drawn glyph by glyph with the KaTeX fonts
# (see core::math, editor::math): no WebView.
ratex-parser = "0.1.16"
ratex-layout = "0.1.16"
ratex-types = "0.1.16"
ratex-katex-fonts = "0.1.16"
# The outlines of the KaTeX glyphs GPUI cannot draw (already built in by GPUI).
ttf-parser = "0.25"
# Mermaid diagrams as SVG, drawn by GPUI (see core::diagram).
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
htmd = "0.6"

# Sparkle, loaded from the bundle at launch (see app::updates; already built in by GPUI).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString", "NSURL", "NSDictionary", "NSGeometry", "NSObject", "NSError", "NSValue", "NSRange", "NSArray", "NSTextCheckingResult", "NSOrthography"] }
# The HTML a copy carries, pasted as Markdown (see editor::clipboard).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSPasteboard", "NSPrintInfo", "NSPrintOperation", "NSView", "NSResponder", "NSWindow", "NSGraphics", "NSApplication", "NSRunningApplication", "NSSpellChecker"] }
# Export as PDF and Print: the exported page laid out by the system's WebKit,
# paged by AppKit's printing (see app::print); nothing else uses it.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKNavigation", "WKNavigationDelegate", "block2"] }
block2 = "0.6"
dispatch2 = "0.3"

[dev-dependencies]
gpui-kit = { version = "0.10.0", features = ["syntect", "test-support"] }

# `cargo run` builds GPUI and the other dependencies optimized: unoptimized, the
# editor lags at every keystroke. Noteki's own code stays quick to build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Release, for every day (scripts/bundle.sh, tests in release): thin LTO,
# 33 s after a small change instead of 105 s, a 30 MB binary instead of 24.
# Unwinding stays: `markdown::reader_guard` catches markdown-rs's panics
# (`panic = "abort"` would give 14 MB and crash the Reader instead).
[profile.release]
strip = true
lto = "thin"
codegen-units = 16

# What is published (scripts/release.sh): the smallest binary, fat LTO in one
# unit, the same speed in examples/perf; slow to build, so only there.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
