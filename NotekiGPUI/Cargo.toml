[package]
name = "noteki-gpui"
version = "0.1.0"
edition = "2021"
description = "Noteki GPUI prototype using gpui-kit"

[dependencies]
gpui-kit = { version = "0.10.0", features = ["syntect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
similar = "2"
imagesize = "0.13"
dirs = "6"
chrono = "0.4"
