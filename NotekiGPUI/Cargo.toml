[package]
name = "noteki-gpui"
version = "0.1.0"
edition = "2021"
description = "Noteki GPUI prototype using gpui-kit"

[lib]
name = "noteki_gpui"
path = "src/lib.rs"

[[bin]]
name = "noteki-gpui"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "0.10.0", features = ["syntect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
similar = "2"
# Find in a Note (already built in through syntect).
regex = "1"
unicode-segmentation = "1"
# Code blocks' colours: the same syntect and syntax set GPUI Kit's `syntect`
# feature already builds in, so they add nothing to the binary.
syntect = { version = "5.3", default-features = false }
two-face = { version = "0.4.5", default-features = false }
imagesize = "0.13"
dirs = "6"
chrono = "0.4"
# Same version GPUI Kit's TextView parses with: used to pre-flight the Reader (see core::markdown::reader_guard).
markdown = "=1.0.0"
# Files the Finder asks to open, handed to the window (already built in by GPUI).
async-channel = "2"

[dev-dependencies]
gpui-kit = { version = "0.10.0", features = ["syntect", "test-support"] }

# `cargo run` builds GPUI and the other dependencies optimized: unoptimized, the
# editor lags at every keystroke. Noteki's own code stays quick to build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Release: 29 MB → 17 MB (SPEC › Budget: under 20), same speed in examples/perf.
# Unwinding stays: `markdown::reader_guard` catches markdown-rs's panics
# (`panic = "abort"` would give 14 MB and crash the Reader instead).
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
