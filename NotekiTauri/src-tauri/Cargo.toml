[package]
name = "noteki-tauri"
version = "0.1.0"
description = "Noteki cross-platform prototype (Tauri)"
edition = "2021"

[lib]
name = "noteki_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
similar = "2"
imagesize = "0.13"
urlencoding = "2"
