<html>
<head>
<meta charset="utf-8">
<style>:root {
  color-scheme: light dark;
  --text: #1d1d1f;
  --background: #ffffff;
  --syntax: #a1a1a6;
  --link: #0064d1;
  --quote: #6e6e73;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --system-font: -apple-system, BlinkMacSystemFont, sans-serif;
  --on-link: #ffffff;
  --line-width: 736px;
  /* Settings: the app sets them before the page loads. */
  --text-font: var(--system-font);
  --text-size: 15px;
  --panel: #f5f5f7;
  --separator: #d2d2d7;
  --code-background: rgba(0, 0, 0, 0.05);
  --highlight: rgba(255, 208, 0, 0.4);
  --quote-text: var(--quote);
  --frontmatter-text: var(--syntax);
  --error: #e93147;
  --accent-rgb: 0, 100, 209;
}

@media (prefers-color-scheme: dark) {
  :root {
    --text: #e8e8ed;
    --background: #1e1e1e;
    --syntax: #6e6e73;
    --link: #5aa9ff;
    --accent-rgb: 90, 169, 255;
    --quote: #a1a1a6;
    --panel: #2a2a2c;
    --separator: #3a3a3c;
    --code-background: rgba(255, 255, 255, 0.08);
    --highlight: rgba(255, 208, 0, 0.3);
  }
}

html,
body {
  margin: 0;
  height: 100%;
  background: var(--background);
  color: var(--text);
}

#editor,
.cm-editor {
  height: 100%;
}

.cm-editor.cm-focused {
  outline: none;
}

.cm-content {
  caret-color: var(--text);
}
</style>
