# Noteki on Linux: every check the Mac runs that needs no Mac (unit,
# regressions, robustness, demo vault, the headless UI tests), then the
# package (scripts/package-linux.sh), kept as the run's artifact.
name: Noteki on Linux

on:
  push:
    paths: ["src/**", "tests/**", "examples/**", "icons/**", "linux/**", "scripts/package-linux.sh", "Cargo.*", "docs/demo-vault/**", ".github/workflows/linux.yml"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Libraries GPUI links
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libfontconfig-dev \
            libfreetype-dev libx11-xcb-dev libvulkan1 libzstd-dev fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked
      - name: Package
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: noteki-linux-x86_64
          path: target/release/noteki-linux-x86_64.tar.gz
